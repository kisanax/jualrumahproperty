name: Build & Deploy ke Hostinger

# Build dijalankan di server GitHub (cepat), hasil jadi (standalone) dikirim
# via SSH ke Hostinger. Build TIDAK pernah jalan di Hostinger (builder
# hPanel OOM/fail 16 menit — build 16.3.6 gagal 5 Nov 2026).
#
# Mekanisme aktif (Passenger + hbuilds):
#   1. standalone.tgz diekstrak ke hbuilds/versions/gha-<run>/nodejs
#   2. symlink hbuilds/current -> versi baru (flip atomik)
#   3. touch hbuilds/current/nodejs/tmp/restart.txt -> Passenger graceful restart
#      (lihat public_html/.htaccess: PassengerAppRoot .../hbuilds/current/nodejs)
#
# Secrets wajib di GitHub → Settings → Secrets and variables → Actions:
#   SSH_HOST         — IP VPS (145.79.14.220)
#   SSH_PORT         — port SSH (65002)
#   SSH_USERNAME     — user SSH (u103983663)
#   SSH_PRIVATE_KEY  — private key PEM penuh (pasangan dari pubkey di authorized_keys)
#   DEPLOY_PATH      — direktori app di VPS, contoh: /home/u103983663/apps/jualrumahproperty
# Secrets opsional:
#   RESTART_COMMAND  — perintah restart setelah ekstrak, mis. pm2 restart jrp
#                      (kosong = lewati; bisa juga restart via panel Hostinger)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      BUILD_MODE: standalone
      NEXT_TELEMETRY_DISABLED: "1"
      # Dummy env hanya agar import modul (Prisma/Auth) tidak error saat build.
      # Tidak dipakai untuk query — semua halaman data sudah force-dynamic.
      DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
      AUTH_SECRET: "build-only-dummy-secret"
      # NEXT_PUBLIC_* di-inline saat build (client bundle), bukan dibaca runtime.
      NEXT_PUBLIC_SITE_STATUS: "production"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build

      - name: Susun paket standalone
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf standalone.tgz -C .next/standalone .

      - name: Validasi secrets SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ] && missing="$missing SSH_HOST"
          [ -z "$SSH_PRIVATE_KEY" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "$DEPLOY_PATH" ] && missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Secrets belum diset:$missing — lihat .github/workflows/deploy.yml header."
            exit 1
          fi

      - name: Upload artifact ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: standalone.tgz
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Ekstrak di VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_ID: gha-${{ github.run_number }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE_ID
          script: |
            set -e
            # App dilayani Passenger via hbuilds/current -> hbuilds/versions/<id>/nodejs
            # (lihat .htaccess: PassengerAppRoot .../hbuilds/current/nodejs)
            HB="/home/u103983663/domains/jualrumahproperty.com/hbuilds"
            REL="$HB/versions/$RELEASE_ID"
            mkdir -p "$REL/nodejs"
            cd ${{ secrets.DEPLOY_PATH }}
            tar -xzf standalone.tgz -C "$REL/nodejs"
            rm -f standalone.tgz
            # Symlink flip atomik ke versi baru
            ln -sfn "versions/$RELEASE_ID" "$HB/current"
            echo "✓ Release $RELEASE_ID terpasang & aktif"

      - name: Restart Passenger & bersihkan versi lama
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            HB="/home/u103983663/domains/jualrumahproperty.com/hbuilds"
            # Passenger memantau tmp/restart.txt — touch = graceful restart
            mkdir -p "$HB/current/nodejs/tmp"
            touch "$HB/current/nodejs/tmp/restart.txt"
            echo "✓ Passenger restart diminta"
            # Simpan 3 versi terbaru saja (abaikan yang sedang jadi target current)
            cd "$HB/versions"
            ls -1t | tail -n +4 | while read -r v; do
              if [ "$(basename "$(readlink "$HB/current")")" != "$v" ]; then
                rm -rf "$v"
                echo "✓ Versi lama dihapus: $v"
              fi
            done
