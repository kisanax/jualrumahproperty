to tidak butuh dots/panah/hitung, 0 foto tidak\n     butuh track sama sekali. Keduanya harus tetap tampil rapi. */\n  .gal.is-single .gnav,\n  .gal.is-single .dots,\n  .gal.is-single .gcount,\n  .gal.is-single .gstrip{display:none}\n  .gal.is-empty .gal-viewport,\n  .gal.is-empty .gstrip{display:none}\n  .gal-empty{display:none;border:1px dashed #dcdcdc;border-radius:14px;background:var(--soft);padding:60px 24px;text-align:center}\n  .gal.is-empty .gal-empty{display:block}\n  .gal-empty b{display:block;font-size:16px;font-weight:700;margin-bottom:6px}\n  .gal-empty span{font-size:13.5px;color:var(--muted)}\n  .gal-empty button{margin-top:16px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13.5px;cursor:pointer}\n\n  /* ---------- band angka tipografis (B) ---------- */\n  .band{display:grid;grid-template-columns:repeat(6,1fr);margin:32px 0 0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}\n  .cell{padding:20px 6px;text-align:center;border-right:1px solid var(--line)}\n  .cell:last-child{border-right:0}\n  .cell b{display:block;font-size:clamp(19px,2.3vw,27px);font-weight:800;letter-spacing:-.03em}\n  .cell b small{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}\n  .cell span{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n\n  /* ---------- layout utama ---------- */\n  .main{display:grid;grid-template-columns:1fr 378px;gap:52px;padding:40px 0 84px;align-items:start}\n\n  /* narasi (B) */\n  .narr{max-width:660px}\n  .narr h2{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:18px}\n  .narr p{font-size:17px;line-height:1.78;color:#333;margin-bottom:18px}\n  .narr .drop::first-letter{font-size:50px;font-weight:800;float:left;line-height:.82;margin:5px 10px 0 0}\n  .narr .more-desc{font-size:13.5px;font-weight:700;color:var(--red);border:0;background:transparent;cursor:pointer;padding:0}\n\n  /* galeri cerita (B) tapi tetap di dalam kerangka */\n  .story{margin:36px 0 8px;display:flex;flex-direction:column;gap:10px}\n  .shot{position:relative;border-radius:12px;overflow:hidden}\n  .shot img{aspect-ratio:16/9}\n  .shot.tall img{aspect-ratio:4/5;max-width:520px;margin:0 auto}\n  .shot .cap{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.94);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:#444}\n  .story-cta{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin-top:4px}\n  .story-cta button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}\n\n  /* blok konten: hairline, bukan kartu (B) — bukan background abu ala dashboard */\n  .block{margin-top:42px;padding-top:30px;border-top:1px solid var(--line)}\n  .block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}\n  .block h3{font-size:17px;font-weight:700;letter-spacing:-.01em}\n  .block-head .n{font-size:12.5px;color:#a0a0a0;font-weight:600}\n\n  .chips{display:flex;flex-wrap:wrap;gap:9px}\n  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:13.5px;font-weight:500}\n  .chip svg{width:17px;height:17px;stroke:var(--red);fill:none;stroke-width:1.7;flex:0 0 17px}\n\n  .specs{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}\n  .spec{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}\n  .spec span{color:var(--muted)}\n  .spec b{font-weight:600;text-align:right}\n\n  /* riwayat (C) versi tenang */\n  .tl{display:flex;flex-direction:column;gap:11px;font-size:13.5px}\n  .tl .row{display:flex;gap:11px;align-items:flex-start;line-height:1.5}\n  .tl .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 7px;margin-top:6px}\n  .tl .dot.on{background:var(--wa)}\n  .tl .dot.red{background:var(--red)}\n  .tl b{font-weight:600}\n  .tl span{color:var(--muted)}\n  .trustline{display:flex;align-items:flex-start;gap:9px;background:var(--wa-soft);color:#0d5c3f;border-radius:11px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-top:20px}\n  .trustline b{font-weight:700}\n\n  /* ---------- sidebar sticky (A + C) ---------- */\n  .side{position:sticky;top:80px;align-self:start}\n  .scard{border:1px solid var(--line);border-radius:16px;padding:24px}\n  .price{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.1}\n  .ppm{font-size:12.5px;color:var(--muted);margin:6px 0 4px}\n  .price-note{font-size:12px;color:var(--muted)}\n  .addr{margin:16px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.55}\n  .addr b{color:var(--ink);font-weight:600}\n  .btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:12px;background:var(--wa);color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer}\n  .btn-wa:hover{background:#0d704c}\n  .btn-sub{display:block;width:100%;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:600;font-size:13.5px;margin-top:9px;cursor:pointer}\n  .share{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}\n  .share svg{width:17px;height:17px;fill:var(--muted)}\n  .share .copy{margin-left:auto;border:0;background:transparent;color:var(--red);font-weight:700;font-size:12.5px;cursor:pointer}\n\n  /* kalkulator KPR (C) — di sidebar, bisa dibuka-tutup */\n  details.calc{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}\n  details.calc summary{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;font-weight:700;list-style:none}\n  details.calc summary::-webkit-details- piah(n) {\n    if (n >= 1e9) return \"Rp \" + (n / 1e9).toLocaleString(\"id-ID\", { maximumFractionDigits: 2 }) + \" M\";\n    if (n >= 1e6) return \"Rp \" + (n / 1e6).toLocaleString(\"id-ID\", { maximumFractionDigits: 1 }) + \" jt\";\n    return \"Rp \" + Math.round(n).toLocaleString(\"id-ID\");\n  }\n\n  var dpRange = document.getElementById(\"dpRange\");\n  var dpOut = document.getElementById(\"dpOut\");\n  var rFix = document.getElementById(\"rFix\");\n  var rFloat = document.getElementById(\"rFloat\");\n  var seg = document.getElementById(\"seg\");\n  var years = 15;\n\n  function render() {\n    var dp = Number(dpRange.value);\n    var loan = PRICE * (1 - dp / 100);\n    dpOut.textContent = dp + \"% · \" + rupiah(PRICE * (dp / 100));\n    rFix.textContent = rupiah(pmt(loan, 0.0475, years));\n    rFloat.textContent = rupiah(pmt(loan, 0.11, years));\n    var est = pmt(loan, 0.0475, years);\n    document.querySelector(\".price-note\").textContent =\n      \"Harga negotiable · estimasi cicilan mulai \" + rupiah(est) + \"/bln\";\n    var small = document.querySelector(\".ctabar .p small\");\n    if (small) small.textContent = \"≈ \" + rupiah(est) + \"/bln · estimasi KPR\";\n  }\n\n  dpRange.addEventListener(\"input\", render);\n  seg.addEventListener(\"click\", function (e) {\n    var b = e.target.closest(\"button\");\n    if (!b) return;\n    years = Number(b.getAttribute(\"data-y\"));\n    seg.querySelectorAll(\"button\").forEach(function (x) { x.className = \"\"; });\n    b.className = \"on\";\n    render();\n  });\n\n  var ctabar = document.getElementById(\"ctabar\");\n  window.addEventListener(\"scroll\", function () {\n    if (window.scrollY > 420) ctabar.classList.add(\"show\");\n    else ctabar.classList.remove(\"show\");\n  });\n\n  // Di layar kecil sidebar tampil lebih dulu, jadi simulasi KPR dibuat\n  // terlipat agar cerita properti tidak terdorong jauh ke bawah.\n  var calc = document.querySelector(\"details.calc\");\n  if (window.innerWidth \u003c= 1020 && calc) calc.removeAttribute(\"open\");\n\n  /* ---------- galeri: track geser (swipe) dengan snap ---------- */\n  var track = document.getElementById(\"track\");\n  var slides = [].slice.call(track.querySelectorAll(\".slide\"));\n  var gal = document.querySelector(\".gal\");\n  var dotsBox = document.getElementById(\"dots\");\n  var counter = document.getElementById(\"gcount\");\n  var navs = [].slice.call(document.querySelectorAll(\".gnav\"));\n  var thumbs = [].slice.call(document.querySelectorAll(\"#strip button\"));\n  var tabs = [].slice.call(document.querySelectorAll(\"#gtabs button\"));\n  var current = 0;\n\n  // dots dibangun dari jumlah slide, jadi menambah/hapus media tidak perlu ubah HTML\n  slides.forEach(function () {\n    var dot = document.createElement(\"i\");\n    dotsBox.appendChild(dot);\n  });\n  var dotEls = [].slice.call(dotsBox.children);\n\n  // 0 foto -> empty state; 1 foto -> tanpa dots/panah/counter/strip.\n  var multi = slides.length > 1;\n  if (slides.length === 0) gal.className = \"gal is-empty\";\n  else if (!multi) gal.className = \"gal is-single\";\n\n  // Slide yang paling dekat dengan posisi geser saat ini. Dipakai saat jari\n  // berhenti di antara dua foto (swipe sebagian), jadi tidak melompat 2 langkah.\n  function nearest() {\n    var w = track.clientWidth || 1;\n    var i = Math.round(track.scrollLeft / w);\n    return Math.max(0, Math.min(slides.length - 1, i));\n  }\n\n  function paint() {\n    var i = current;\n    if (!slides.length) return; // tidak ada yang perlu dihitung saat galeri kosong\n    counter.textContent = i + 1 + \" / \" + slides.length;\n    dotEls.forEach(function (d, j) {\n      d.className = j === i ? \"on\" : \"\";\n    });\n    thumbs.forEach(function (b) {\n      b.className = Number(b.getAttribute(\"data-i\")) === i ? \"on\" : \"\";\n    });\n    var kind = slides[i].getAttribute(\"data-kind\");\n    tabs.forEach(function (t) {\n      t.className = t.getAttribute(\"data-kind\") === kind ? \"on\" : \"\";\n    });\n    navs.forEach(function (n) {\n      var step = Number(n.getAttribute(\"data-nav\"));\n      n.disabled = step \u003c 0 ? i === 0 : i === slides.length - 1;\n    });\n  }\n\n  function go(i) {\n    if (!slides.length) return;\n    current = Math.max(0, Math.min(slides.length - 1, i));\n    track.scrollTo({ left: current * track.clientWidth, behavior: \"smooth\" });\n    // paint() dipanggil langsung (tidak menunggu event scroll) supaya counter,\n    // dots, dan strip ikut berubah begitu tombol ditekan.\n    paint();\n  }\n\n  // paint() sengaja dipanggil langsung, bukan lewat requestAnimationFrame:\n  // kalau frame tidak diproduksi (tab tidak terlihat, renderer tersendat),\n  // rAF tidak pernah jalan dan counter/dots tertinggal dari posisi geser.\n  track.addEventListener(\n    \"scroll\",\n    function () {\n      current = nearest();\n      paint();\n    },\n    { passive: true }\n  );\n  window.addEventListener(\"resize\", function () {\n    go(current);\n  });\n  // Langkah dihitung dari `current` (slide yang sedang ditampilkan), bukan\n  // dari posisi geser mentah: saat animasi masih berjalan posisi geser belum\n  // sampai, jadi klik panah beruntun tidak akan berhenti di slide yang sama.\n  navs.forEach(function (n) {\n    n.addEventListener(\"click\", function () {\n      go(current + Number(n.getAttribute(\"data-nav\")));\n    });\n  });\n  thumbs.forEach(function (b) {\n    b.addEventListener(\"click\", function () {\n      go(Number(b.getAttribute(\"data-i\")));\n    });\n  });\n  tabs.forEach(function (t) {\n    t.addEventListener(\"click\", function () {\n      var kind = t.getAttribute(\"data-kind\");\n      for (var i = 0; i \u003c slides.length; i++) {\n        if (slides[i].getAttribute(\"data-kind\") === kind) {\n          go(i);\n          return;\n        }\n      }\n    });\n  });\n  track.addEventListener(\"keydown\", function (e) {\n    if (e.key === \"ArrowRight\") {\n      go(current + 1);\n      e.preventDefault();\n    } else if (e.key === \"ArrowLeft\") {\n      go(current - 1);\n      e.preventDefault();\n    }\n  });\n  var storyCta = document.querySelector(\".story-cta button\");\n  if (storyCta) {\n    storyCta.addEventListener(\"click\", function () {\n      document.querySelector(\".gal\").scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    });\n  }\n  paint();\n\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",
    d1: "\u003c!DOCTYPE html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>Konsep D — Editorial Marketplace (Paduan A+B+C) · Detail Properti\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\" />\n\u003cstyle>\n  :root{\n    --red:#c52004; --red-hover:#a31803; --red-soft:#fdece7; --red-deep:#7a1302;\n    --ink:#222222; --muted:#717171; --line:#ebebeb; --soft:#f7f7f7;\n    --wa:#128c5e; --wa-soft:#e8f5ee;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}\n  a{color:inherit;text-decoration:none}\n  img{display:block;width:100%;object-fit:cover}\n  button{font-family:inherit}\n  .demo-tag{position:fixed;top:0;left:0;z-index:99;background:var(--red);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 14px;border-radius:0 0 8px 0}\n  .demo-nav{position:fixed;top:8px;right:8px;z-index:99;display:flex;gap:6px}\n  .demo-nav a{background:#fff;border:1px solid #ddd;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;color:#333}\n  .demo-nav a.on{background:#c52004;color:#fff;border-color:#c52004}\n\n  /* ---------- header: ringkas & menempel (A) ---------- */\n  header.site{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 40px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}\n  .logo{font-weight:800;font-size:17px;letter-spacing:-.02em}\n  .logo em{font-style:normal;color:var(--red)}\n  nav.top{display:flex;align-items:center;gap:26px;font-size:13.5px;color:var(--muted)}\n  nav.top a.cta{color:#fff;background:var(--red);padding:8px 16px;border-radius:9px;font-weight:600;font-size:13px}\n\n  .wrap{width:min(1240px,calc(100% - 48px));margin:0 auto}\n  .crumbs{display:flex;gap:8px;font-size:12.5px;color:var(--muted);padding:14px 0}\n  .crumbs b{color:var(--ink);font-weight:600}\n\n  /* ---------- masthead editorial ringkas (B, dikompres) ---------- */\n  .masthead{padding:26px 0 22px}\n  .kicker{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--red)}\n  h1{font-size:clamp(27px,3.4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.16;max-width:880px;margin:12px 0 0}\n  .mline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px;font-size:14px;color:var(--muted)}\n  .mline .p{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.02em}\n  .mline .dot{color:#d5d5d5}\n  .tagline{font-size:13px;color:var(--muted);margin-top:10px}\n\n  /* ---------- galeri: track geser (swipe) + strip thumbnail ---------- */\n  .gal{position:relative}\n  .gal-viewport{position:relative;border-radius:14px;overflow:hidden;height:clamp(260px,40vw,470px);background:#111}\n  .track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none;outline:none}\n  .track::-webkit-scrollbar{display:none}\n  .track:focus-visible{outline:2px solid var(--red);outline-offset:-2px}\n  .slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always}\n  .slide img{height:100%}\n  .slide .scap{position:absolute;bottom:14px;left:16px;max-width:58%;background:rgba(255,255,255,.94);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:#444}\n  .slide .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#111;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.3);padding-left:5px}\n  .slide .plan{width:100%;height:100%;background:#f4f2ee;display:flex;align-items:center;justify-content:center}\n  .slide .plan svg{width:min(620px,78%);height:auto}\n  .gtabs{position:absolute;top:14px;left:16px;z-index:3;display:flex;gap:6px}\n  .gtabs button{border:0;background:rgba(255,255,255,.93);color:#333;border-radius:99px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer}\n  .gtabs button.on{background:#111;color:#fff}\n  .gnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#111;font-size:19px;line-height:1;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.24);display:flex;align-items:center;justify-content:center}\n  .gnav.prev{left:14px}\n  .gnav.next{right:14px}\n  .gnav[disabled]{opacity:.3;cursor:default}\n  .gcount{position:absolute;bottom:14px;right:14px;z-index:3;background:rgba(20,20,20,.72);color:#fff;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:700}\n  .dots{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:3;display:none;gap:6px}\n  .dots i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:width .2s,background .2s}\n  .dots i.on{width:18px;border-radius:99px;background:#fff}\n  .gstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}\n  .gstrip button{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:#eee}\n  .gstrip button.on{outline:2px solid var(--ink);outline-offset:-2px}\n  .gstrip .tcap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:11px;font-weight:600;padding:16px 9px 7px;text-align:left}\n  .gstrip .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.5)}\n\n  /* Keadaan media minim: 1 foto tidak butuh dots/panah/hitung, 0 foto tidak\n     butuh track sama sekali. Keduanya harus tetap tampil rapi. */\n  .gal.is-single .gnav,\n  .gal.is-single .dots,\n  .gal.is-single .gcount,\n  .gal.is-single .gstrip{display:none}\n  .gal.is-empty .gal-viewport,\n  .gal.is-empty .gstrip{display:none}\n  .gal-empty{display:none;border:1px dashed #dcdcdc;border-radius:14px;background:var(--soft);padding:60px 24px;text-align:center}\n  .gal.is-empty .gal-empty{display:block}\n  .gal-empty b{display:block;font-size:16px;font-weight:700;margin-bottom:6px}\n  .gal-empty span{font-size:13.5px;color:var(--muted)}\n  .gal-empty button{margin-top:16px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13.5px;cursor:pointer}\n\n  /* ---------- band angka tipografis (B) ---------- */\n  .band{display:grid;grid-template-columns:repeat(6,1fr);margin:32px 0 0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}\n  .cell{padding:20px 6px;text-align:center;border-right:1px solid var(--line)}\n  .cell:last-child{border-right:0}\n  .cell b{display:block;font-size:clamp(19px,2.3vw,27px);font-weight:800;letter-spacing:-.03em}\n  .cell b small{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}\n  .cell span{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n\n  /* ---------- layout utama ---------- */\n  .main{display:grid;grid-template-columns:1fr 378px;gap:52px;padding:40px 0 84px;align-items:start}\n\n  /* narasi (B) */\n  .narr{max-width:660px}\n  .narr h2{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:18px}\n  .narr p{font-size:17px;line-height:1.78;color:#333;margin-bottom:18px}\n  .narr .drop::first-letter{font-size:50px;font-weight:800;float:left;line-height:.82;margin:5px 10px 0 0}\n  .narr .more-desc{font-size:13.5px;font-weight:700;color:var(--red);border:0;background:transparent;cursor:pointer;padding:0}\n\n  /* galeri cerita (B) tapi tetap di dalam kerangka */\n  .story{margin:36px 0 8px;display:flex;flex-direction:column;gap:10px}\n  .shot{position:relative;border-radius:12px;overflow:hidden}\n  .shot img{aspect-ratio:16/9}\n  .shot.tall img{aspect-ratio:4/5;max-width:520px;margin:0 auto}\n  .shot .cap{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.94);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:#444}\n  .story-cta{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin-top:4px}\n  .story-cta button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}\n\n  /* blok konten: hairline, bukan kartu (B) — bukan background abu ala dashboard */\n  .block{margin-top:42px;padding-top:30px;border-top:1px solid var(--line)}\n  .block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}\n  .block h3{font-size:17px;font-weight:700;letter-spacing:-.01em}\n  .block-head .n{font-size:12.5px;color:#a0a0a0;font-weight:600}\n\n  .chips{display:flex;flex-wrap:wrap;gap:9px}\n  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:13.5px;font-weight:500}\n  .chip svg{width:17px;height:17px;stroke:var(--red);fill:none;stroke-width:1.7;flex:0 0 17px}\n\n  .specs{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}\n  .spec{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}\n  .spec span{color:var(--muted)}\n  .spec b{font-weight:600;text-align:right}\n\n  /* riwayat (C) versi tenang */\n  .tl{display:flex;flex-direction:column;gap:11px;font-size:13.5px}\n  .tl .row{display:flex;gap:11px;align-items:flex-start;line-height:1.5}\n  .tl .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 7px;margin-top:6px}\n  .tl .dot.on{background:var(--wa)}\n  .tl .dot.red{background:var(--red)}\n  .tl b{font-weight:600}\n  .tl span{color:var(--muted)}\n  .trustline{display:flex;align-items:flex-start;gap:9px;background:var(--wa-soft);color:#0d5c3f;border-radius:11px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-top:20px}\n  .trustline b{font-weight:700}\n\n  /* ---------- sidebar sticky (A + C) ---------- */\n  .side{position:sticky;top:80px;align-self:start}\n  .scard{border:1px solid var(--line);border-radius:16px;padding:24px}\n  .price{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.1}\n  .ppm{font-size:12.5px;color:var(--muted);margin:6px 0 4px}\n  .price-note{font-size:12px;color:var(--muted)}\n  .addr{margin:16px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.55}\n  .addr b{color:var(--ink);font-weight:600}\n  .btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:12px;background:var(--wa);color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer}\n  .btn-wa:hover{background:#0d704c}\n  .btn-sub{display:block;width:100%;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:600;font-size:13.5px;margin-top:9px;cursor:pointer}\n  .share{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}\n  .share svg{width:17px;height:17px;fill:var(--muted)}\n  .share .copy{margin-left:auto;border:0;background:transparent;color:var(--red);font-weight:700;font-size:12.5px;cursor:pointer}\n\n  /* kalkulator KPR (C) — di sidebar, bisa dibuka-tutup */\n  details.calc{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}\n  details.calc summary{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;font-weight:700;list-style:none}\n  details.calc summary::-webkit-details return;\n    years = Number(b.getAttribute(\"data-y\"));\n    seg.querySelectorAll(\"button\").forEach(function (x) { x.className = \"\"; });\n    b.className = \"on\";\n    render();\n  });\n\n  var ctabar = document.getElementById(\"ctabar\");\n  window.addEventListener(\"scroll\", function () {\n    if (window.scrollY > 420) ctabar.classList.add(\"show\");\n    else ctabar.classList.remove(\"show\");\n  });\n\n  // Di layar kecil sidebar tampil lebih dulu, jadi simulasi KPR dibuat\n  // terlipat agar cerita properti tidak terdorong jauh ke bawah.\n  var calc = document.querySelector(\"details.calc\");\n  if (window.innerWidth \u003c= 1020 && calc) calc.removeAttribute(\"open\");\n\n  /* ---------- galeri: track geser (swipe) dengan snap ---------- */\n  var track = document.getElementById(\"track\");\n  var slides = [].slice.call(track.querySelectorAll(\".slide\"));\n  var gal = document.querySelector(\".gal\");\n  var dotsBox = document.getElementById(\"dots\");\n  var counter = document.getElementById(\"gcount\");\n  var navs = [].slice.call(document.querySelectorAll(\".gnav\"));\n  var thumbs = [].slice.call(document.querySelectorAll(\"#strip button\"));\n  var tabs = [].slice.call(document.querySelectorAll(\"#gtabs button\"));\n  var current = 0;\n\n  // dots dibangun dari jumlah slide, jadi menambah/hapus media tidak perlu ubah HTML\n  slides.forEach(function () {\n    var dot = document.createElement(\"i\");\n    dotsBox.appendChild(dot);\n  });\n  var dotEls = [].slice.call(dotsBox.children);\n\n  // 0 foto -> empty state; 1 foto -> tanpa dots/panah/counter/strip.\n  var multi = slides.length > 1;\n  if (slides.length === 0) gal.className = \"gal is-empty\";\n  else if (!multi) gal.className = \"gal is-single\";\n\n  // Slide yang paling dekat dengan posisi geser saat ini. Dipakai saat jari\n  // berhenti di antara dua foto (swipe sebagian), jadi tidak melompat 2 langkah.\n  function nearest() {\n    var w = track.clientWidth || 1;\n    var i = Math.round(track.scrollLeft / w);\n    return Math.max(0, Math.min(slides.length - 1, i));\n  }\n\n  function paint() {\n    var i = current;\n    if (!slides.length) return; // tidak ada yang perlu dihitung saat galeri kosong\n    counter.textContent = i + 1 + \" / \" + slides.length;\n    dotEls.forEach(function (d, j) {\n      d.className = j === i ? \"on\" : \"\";\n    });\n    thumbs.forEach(function (b) {\n      b.className = Number(b.getAttribute(\"data-i\")) === i ? \"on\" : \"\";\n    });\n    var kind = slides[i].getAttribute(\"data-kind\");\n    tabs.forEach(function (t) {\n      t.className = t.getAttribute(\"data-kind\") === kind ? \"on\" : \"\";\n    });\n    navs.forEach(function (n) {\n      var step = Number(n.getAttribute(\"data-nav\"));\n      n.disabled = step \u003c 0 ? i === 0 : i === slides.length - 1;\n    });\n  }\n\n  function go(i) {\n    if (!slides.length) return;\n    current = Math.max(0, Math.min(slides.length - 1, i));\n    track.scrollTo({ left: current * track.clientWidth, behavior: \"smooth\" });\n    // paint() dipanggil langsung (tidak menunggu event scroll) supaya counter,\n    // dots, dan strip ikut berubah begitu tombol ditekan.\n    paint();\n  }\n\n  // paint() sengaja dipanggil langsung, bukan lewat requestAnimationFrame:\n  // kalau frame tidak diproduksi (tab tidak terlihat, renderer tersendat),\n  // rAF tidak pernah jalan dan counter/dots tertinggal dari posisi geser.\n  track.addEventListener(\n    \"scroll\",\n    function () {\n      current = nearest();\n      paint();\n    },\n    { passive: true }\n  );\n  window.addEventListener(\"resize\", function () {\n    go(current);\n  });\n  // Langkah dihitung dari `current` (slide yang sedang ditampilkan), bukan\n  // dari posisi geser mentah: saat animasi masih berjalan posisi geser belum\n  // sampai, jadi klik panah beruntun tidak akan berhenti di slide yang sama.\n  navs.forEach(function (n) {\n    n.addEventListener(\"click\", function () {\n      go(current + Number(n.getAttribute(\"data-nav\")));\n    });\n  });\n  thumbs.forEach(function (b) {\n    b.addEventListener(\"click\", function () {\n      go(Number(b.getAttribute(\"data-i\")));\n    });\n  });\n  tabs.forEach(function (t) {\n    t.addEventListener(\"click\", function () {\n      var kind = t.getAttribute(\"data-kind\");\n      for (var i = 0; i \u003c slides.length; i++) {\n        if (slides[i].getAttribute(\"data-kind\") === kind) {\n          go(i);\n          return;\n        }\n      }\n    });\n  });\n  track.addEventListener(\"keydown\", function (e) {\n    if (e.key === \"ArrowRight\") {\n      go(current + 1);\n      e.preventDefault();\n    } else if (e.key === \"ArrowLeft\") {\n      go(current - 1);\n      e.preventDefault();\n    }\n  });\n  var storyCta = document.querySelector(\".story-cta button\");\n  if (storyCta) {\n    storyCta.addEventListener(\"click\", function () {\n      document.querySelector(\".gal\").scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    });\n  }\n  paint();\n\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",
    d0: "\u003c!DOCTYPE html>\n\u003chtml lang=\"id\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>Konsep D — Editorial Marketplace (Paduan A+B+C) · Detail Properti\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\" />\n\u003cstyle>\n  :root{\n    --red:#c52004; --red-hover:#a31803; --red-soft:#fdece7; --red-deep:#7a1302;\n    --ink:#222222; --muted:#717171; --line:#ebebeb; --soft:#f7f7f7;\n    --wa:#128c5e; --wa-soft:#e8f5ee;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}\n  a{color:inherit;text-decoration:none}\n  img{display:block;width:100%;object-fit:cover}\n  button{font-family:inherit}\n  .demo-tag{position:fixed;top:0;left:0;z-index:99;background:var(--red);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 14px;border-radius:0 0 8px 0}\n  .demo-nav{position:fixed;top:8px;right:8px;z-index:99;display:flex;gap:6px}\n  .demo-nav a{background:#fff;border:1px solid #ddd;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600;color:#333}\n  .demo-nav a.on{background:#c52004;color:#fff;border-color:#c52004}\n\n  /* ---------- header: ringkas & menempel (A) ---------- */\n  header.site{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 40px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}\n  .logo{font-weight:800;font-size:17px;letter-spacing:-.02em}\n  .logo em{font-style:normal;color:var(--red)}\n  nav.top{display:flex;align-items:center;gap:26px;font-size:13.5px;color:var(--muted)}\n  nav.top a.cta{color:#fff;background:var(--red);padding:8px 16px;border-radius:9px;font-weight:600;font-size:13px}\n\n  .wrap{width:min(1240px,calc(100% - 48px));margin:0 auto}\n  .crumbs{display:flex;gap:8px;font-size:12.5px;color:var(--muted);padding:14px 0}\n  .crumbs b{color:var(--ink);font-weight:600}\n\n  /* ---------- masthead editorial ringkas (B, dikompres) ---------- */\n  .masthead{padding:26px 0 22px}\n  .kicker{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--red)}\n  h1{font-size:clamp(27px,3.4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.16;max-width:880px;margin:12px 0 0}\n  .mline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px;font-size:14px;color:var(--muted)}\n  .mline .p{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.02em}\n  .mline .dot{color:#d5d5d5}\n  .tagline{font-size:13px;color:var(--muted);margin-top:10px}\n\n  /* ---------- galeri: track geser (swipe) + strip thumbnail ---------- */\n  .gal{position:relative}\n  .gal-viewport{position:relative;border-radius:14px;overflow:hidden;height:clamp(260px,40vw,470px);background:#111}\n  .track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none;outline:none}\n  .track::-webkit-scrollbar{display:none}\n  .track:focus-visible{outline:2px solid var(--red);outline-offset:-2px}\n  .slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always}\n  .slide img{height:100%}\n  .slide .scap{position:absolute;bottom:14px;left:16px;max-width:58%;background:rgba(255,255,255,.94);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:#444}\n  .slide .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#111;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.3);padding-left:5px}\n  .slide oto tidak butuh dots/panah/hitung, 0 foto tidak\n     butuh track sama sekali. Keduanya harus tetap tampil rapi. */\n  .gal.is-single .gnav,\n  .gal.is-single .dots,\n  .gal.is-single .gcount,\n  .gal.is-single .gstrip{display:none}\n  .gal.is-empty .gal-viewport,\n  .gal.is-empty .gstrip{display:none}\n  .gal-empty{display:none;border:1px dashed #dcdcdc;border-radius:14px;background:var(--soft);padding:60px 24px;text-align:center}\n  .gal.is-empty .gal-empty{display:block}\n  .gal-empty b{display:block;font-size:16px;font-weight:700;margin-bottom:6px}\n  .gal-empty span{font-size:13.5px;color:var(--muted)}\n  .gal-empty button{margin-top:16px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13.5px;cursor:pointer}\n\n  /* ---------- band angka tipografis (B) ---------- */\n  .band{display:grid;grid-template-columns:repeat(6,1fr);margin:32px 0 0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}\n  .cell{padding:20px 6px;text-align:center;border-right:1px solid var(--line)}\n  .cell:last-child{border-right:0}\n  .cell b{display:block;font-size:clamp(19px,2.3vw,27px);font-weight:800;letter-spacing:-.03em}\n  .cell b small{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}\n  .cell span{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n\n  /* ---------- layout utama ---------- */\n  .main{display:grid;grid-template-columns:1fr 378px;gap:52px;padding:40px 0 84px;align-items:start}\n\n  /* narasi (B) */\n  .narr{max-width:660px}\n  .narr h2{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:18px}\n  .narr p{font-size:17px;line-height:1.78;color:#333;margin-bottom:18px}\n  .narr .drop::first-letter{font-size:50px;font-weight:800;float:left;line-height:.82;margin:5px 10px 0 0}\n  .narr .more-desc{font-size:13.5px;font-weight:700;color:var(--red);border:0;background:transparent;cursor:pointer;padding:0}\n\n  /* galeri cerita (B) tapi tetap di dalam kerangka */\n  .story{margin:36px 0 8px;display:flex;flex-direction:column;gap:10px}\n  .shot{position:relative;border-radius:12px;overflow:hidden}\n  .shot img{aspect-ratio:16/9}\n  .shot.tall img{aspect-ratio:4/5;max-width:520px;margin:0 auto}\n  .shot .cap{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.94);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:#444}\n  .story-cta{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin-top:4px}\n  .story-cta button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}\n\n  /* blok konten: hairline, bukan kartu (B) — bukan background abu ala dashboard */\n  .block{margin-top:42px;padding-top:30px;border-top:1px solid var(--line)}\n  .block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}\n  .block h3{font-size:17px;font-weight:700;letter-spacing:-.01em}\n  .block-head .n{font-size:12.5px;color:#a0a0a0;font-weight:600}\n\n  .chips{display:flex;flex-wrap:wrap;gap:9px}\n  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:13.5px;font-weight:500}\n  .chip svg{width:17px;height:17px;stroke:var(--red);fill:none;stroke-width:1.7;flex:0 0 17px}\n\n  .specs{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}\n  .spec{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}\n  .spec span{color:var(--muted)}\n  .spec b{font-weight:600;text-align:right}\n\n  /* riwayat (C) versi tenang */\n  .tl{display:flex;flex-direction:column;gap:11px;font-size:13.5px}\n  .tl .row{display:flex;gap:11px;align-items:flex-start;line-height:1.5}\n  .tl .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 7px;margin-top:6px}\n  .tl .dot.on{background:var(--wa)}\n  .tl .dot.red{background:var(--red)}\n  .tl b{font-weight:600}\n  .tl span{color:var(--muted)}\n  .trustline{display:flex;align-items:flex-start;gap:9px;background:var(--wa-soft);color:#0d5c3f;border-radius:11px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-top:20px}\n  .trustline b{font-weight:700}\n\n  /* ---------- sidebar sticky (A + C) ---------- */\n  .side{position:sticky;top:80px;align-self:start}\n  .scard{border:1px solid var(--line);border-radius:16px;padding:24px}\n  .price{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.1}\n  .ppm{font-size:12.5px;color:var(--muted);margin:6px 0 4px}\n  .price-note{font-size:12px;color:var(--muted)}\n  .addr{margin:16px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.55}\n  .addr b{color:var(--ink);font-weight:600}\n  .btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:12px;background:var(--wa);color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer}\n  .btn-wa:hover{background:#0d704c}\n  .btn-sub{display:block;width:100%;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:600;font-size:13.5px;margin-top:9px;cursor:pointer}\n  .share{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}\n  .share svg{width:17px;height:17px;fill:var(--muted)}\n  .share .copy{margin-left:auto;border:0;background:transparent;color:var(--red);font-weight:700;font-size:12.5px;cursor:pointer}\n\n  /* kalkulator KPR (C) — di sidebar, bisa dibuka-tutup */\n  details.calc{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}\n  details.calc summary{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;font-weight:700;list-style:none}\n  details.calc summary::-webkit-details return;\n    years = Number(b.getAttribute(\"data-y\"));\n    seg.querySelectorAll(\"button\").forEach(function (x) { x.className = \"\"; });\n    b.className = \"on\";\n    render();\n  });\n\n  var ctabar = document.getElementById(\"ctabar\");\n  window.addEventListener(\"scroll\", function () {\n    if (window.scrollY > 420) ctabar.classList.add(\"show\");\n    else ctabar.classList.remove(\"show\");\n  });\n\n  // Di layar kecil sidebar tampil lebih dulu, jadi simulasi KPR dibuat\n  // terlipat agar cerita properti tidak terdorong jauh ke bawah.\n  var calc = document.querySelector(\"details.calc\");\n  if (window.innerWidth \u003c= 1020 && calc) calc.removeAttribute(\"open\");\n\n  /* ---------- galeri: track geser (swipe) dengan snap ---------- */\n  var track = document.getElementById(\"track\");\n  var slides = [].slice.call(track.querySelectorAll(\".slide\"));\n  var gal = document.querySelector(\".gal\");\n  var dotsBox = document.getElementById(\"dots\");\n  var counter = document.getElementById(\"gcount\");\n  var navs = [].slice.call(document.querySelectorAll(\".gnav\"));\n  var thumbs = [].slice.call(document.querySelectorAll(\"#strip button\"));\n  var tabs = [].slice.call(document.querySelectorAll(\"#gtabs button\"));\n  var current = 0;\n\n  // dots dibangun dari jumlah slide, jadi menambah/hapus media tidak perlu ubah HTML\n  slides.forEach(function () {\n    var dot = document.createElement(\"i\");\n    dotsBox.appendChild(dot);\n  });\n  var dotEls = [].slice.call(dotsBox.children);\n\n  // 0 foto -> empty state; 1 foto -> tanpa dots/panah/counter/strip.\n  var multi = slides.length > 1;\n  if (slides.length === 0) gal.className = \"gal is-empty\";\n  else if (!multi) gal.className = \"gal is-single\";\n\n  // Slide yang paling dekat dengan posisi geser saat ini. Dipakai saat jari\n  // berhenti di antara dua foto (swipe sebagian), jadi tidak melompat 2 langkah.\n  function nearest() {\n    var w = track.clientWidth || 1;\n    var i = Math.round(track.scrollLeft / w);\n    return Math.max(0, Math.min(slides.length - 1, i));\n  }\n\n  function paint() {\n    var i = current;\n    if (!slides.length) return; // tidak ada yang perlu dihitung saat galeri kosong\n    counter.textContent = i + 1 + \" / \" + slides.length;\n    dotEls.forEach(function (d, j) {\n      d.className = j === i ? \"on\" : \"\";\n    });\n    thumbs.forEach(function (b) {\n      b.className = Number(b.getAttribute(\"data-i\")) === i ? \"on\" : \"\";\n    });\n    var kind = slides[i].getAttribute(\"data-kind\");\n    tabs.forEach(function (t) {\n      t.className = t.getAttribute(\"data-kind\") === kind ? \"on\" : \"\";\n    });\n    navs.forEach(function (n) {\n      var step = Number(n.getAttribute(\"data-nav\"));\n      n.disabled = step \u003c 0 ? i === 0 : i === slides.length - 1;\n    });\n  }\n\n  function go(i) {\n    if (!slides.length) return;\n    current = Math.max(0, Math.min(slides.length - 1, i));\n    track.scrollTo({ left: current * track.clientWidth, behavior: \"smooth\" });\n    // paint() dipanggil langsung (tidak menunggu event scroll) supaya counter,\n    // dots, dan strip ikut berubah begitu tombol ditekan.\n    paint();\n  }\n\n  // paint() sengaja dipanggil langsung, bukan lewat requestAnimationFrame:\n  // kalau frame tidak diproduksi (tab tidak terlihat, renderer tersendat),\n  // rAF tidak pernah jalan dan counter/dots tertinggal dari posisi geser.\n  track.addEventListener(\n    \"scroll\",\n    function () {\n      current = nearest();\n      paint();\n    },\n    { passive: true }\n  );\n  window.addEventListener(\"resize\", function () {\n    go(current);\n  });\n  // Langkah dihitung dari `current` (slide yang sedang ditampilkan), bukan\n  // dari posisi geser mentah: saat animasi masih berjalan posisi geser belum\n  // sampai, jadi klik panah beruntun tidak akan berhenti di slide yang sama.\n  navs.forEach(function (n) {\n    n.addEventListener(\"click\", function () {\n      go(current + Number(n.getAttribute(\"data-nav\")));\n    });\n  });\n  thumbs.forEach(function (b) {\n    b.addEventListener(\"click\", function () {\n      go(Number(b.getAttribute(\"data-i\")));\n    });\n  });\n  tabs.forEach(function (t) {\n    t.addEventListener(\"click\", function () {\n      var kind = t.getAttribute(\"data-kind\");\n      for (var i = 0; i \u003c slides.length; i++) {\n        if (slides[i].getAttribute(\"data-kind\") === kind) {\n          go(i);\n          return;\n        }\n      }\n    });\n  });\n  track.addEventListener(\"keydown\", function (e) {\n    if (e.key === \"ArrowRight\") {\n      go(current + 1);\n      e.preventDefault();\n    } else if (e.key === \"ArrowLeft\") {\n      go(current - 1);\n      e.preventDefault();\n    }\n  });\n  var storyCta = document.querySelector(\".story-cta button\");\n  if (storyCta) {\n    storyCta.addEventListener(\"click\", function () {\n      document.querySelector(\".gal\").scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    });\n  }\n  paint();\n\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"
